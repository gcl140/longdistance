{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %} | Lisa</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="shortcut icon" href="{% static 'images/fav.png' %}" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">

  <!-- Toastify -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body class="auth-bg font-karla text-white min-h-screen">

  <!-- Top bar with red wordmark -->
  <header class="absolute inset-x-0 top-0 z-20">
    <div class="px-6 md:px-12 py-5">
      <a href="{% url 'home' %}"
         class="text-netflix-red font-extrabold text-3xl md:text-4xl uppercase"
         style="font-family:'Inter',sans-serif; letter-spacing:-.04em;">LISA</a>
    </div>
  </header>

  <!-- Centered card area -->
  <main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-24">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="relative z-10 text-center text-white/50 text-xs pb-8 px-4">
    © {% now "Y" %} Lisa. All rights reserved.
  </footer>

  {% if messages %}
  <script>
    window.LISA_MESSAGES = [
      {% for message in messages %}{ text: {{ message|escapejs|stringformat:'"%s"' }}, tag: "{{ message.tags|default:'info' }}" }{% if not forloop.last %},{% endif %}{% endfor %}
    ];
  </script>
  <script src="{% static 'js/toasts.js' %}" defer></script>
  {% endif %}

</body>
</html>
