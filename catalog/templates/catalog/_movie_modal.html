{% load static %}
{# Reusable movie detail modal. Include once per page; call openMovie(id) to show. #}
<div x-data="movieModal()" x-init="window.openMovie = (id) => open(id); window.openTmdb = (tid, mt) => openTmdb(tid, mt)" @keydown.escape.window="show=false">
  <div x-show="show" x-cloak class="fixed inset-0 z-[80] bg-black/80 flex items-start md:items-center justify-center p-4 overflow-y-auto" @click.self="show=false">
    <!-- Close button pinned to the viewport so it stays reachable while scrolling -->
    <button @click="show=false" class="fixed top-4 right-4 z-[95] w-10 h-10 rounded-full bg-black/70 hover:bg-black/90 flex items-center justify-center" aria-label="Close"><i class="fas fa-times"></i></button>
    <div class="relative w-full max-w-3xl bg-netflix-dark rounded-xl overflow-hidden border border-white/10 my-8">

      <!-- Backdrop header -->
      <div class="relative h-52 md:h-72 bg-black">
        <template x-if="loading"><div class="absolute inset-0 flex items-center justify-center text-white/40"><i class="fas fa-spinner fa-spin text-2xl"></i></div></template>
        <template x-if="d.backdrop"><img :src="d.backdrop" class="w-full h-full object-cover opacity-60"></template>
        <div class="absolute inset-0 bg-gradient-to-t from-netflix-dark via-netflix-dark/30 to-transparent"></div>
        <div class="absolute bottom-4 left-5 right-5 flex items-end gap-4">
          <template x-if="d.poster"><img :src="d.poster" class="w-20 md:w-28 rounded-lg shadow-2xl hidden sm:block"></template>
          <div class="min-w-0">
            <h2 class="text-2xl md:text-3xl font-extrabold leading-tight" x-text="d.title"></h2>
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1 text-sm text-white/70">
              <span x-show="d.year" x-text="d.year"></span>
              <span x-show="d.runtime" x-text="d.runtime + ' min'"></span>
              <span x-show="d.certification" class="border border-white/40 px-1.5 rounded text-xs" x-text="d.certification"></span>
              <span x-show="d.rating" class="text-yellow-400"><i class="fas fa-star text-xs"></i> <span x-text="d.rating ? d.rating.toFixed(1) : ''"></span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Body -->
      <div class="p-5 space-y-4">
        <template x-if="error">
          <div class="text-center py-6 text-white/70">
            <i class="fas fa-triangle-exclamation text-2xl text-netflix-red mb-3"></i>
            <p class="font-semibold">Couldn't load this movie's details.</p>
            <p class="text-xs text-white/40 mt-1 font-mono break-all" x-text="errMsg"></p>
            <button @click="retry()" class="mt-4 px-4 py-2 rounded bg-white/10 hover:bg-white/20 text-sm font-semibold"><i class="fas fa-rotate-right mr-1"></i>Retry</button>
          </div>
        </template>
        <p x-show="d.tagline" class="italic text-white/60 text-sm" x-text="d.tagline"></p>
        <div class="flex flex-wrap gap-2">
          <template x-for="g in (d.genres||[])" :key="g"><span class="text-xs bg-white/10 px-2 py-0.5 rounded" x-text="g"></span></template>
        </div>
        <p class="text-white/80 text-sm leading-relaxed" x-text="d.overview"></p>
        <div x-show="d.directors && d.directors.length" class="text-sm">
          <span class="text-white/50">Director:</span> <span x-text="(d.directors||[]).join(', ')"></span>
        </div>

        <!-- Cast -->
        <div x-show="d.cast && d.cast.length">
          <h3 class="text-sm text-white/50 mb-2">Cast</h3>
          <div class="flex gap-3 overflow-x-auto pb-1">
            <template x-for="c in (d.cast||[])" :key="c.name">
              <div class="shrink-0 w-16 text-center">
                <div class="w-16 h-16 rounded-full overflow-hidden bg-white/10 mx-auto">
                  <template x-if="c.profile"><img :src="c.profile" class="w-full h-full object-cover"></template>
                  <template x-if="!c.profile"><div class="w-full h-full flex items-center justify-center text-white/30"><i class="fas fa-user"></i></div></template>
                </div>
                <div class="text-[10px] mt-1 truncate" x-text="c.name"></div>
                <div class="text-[9px] text-white/40 truncate" x-text="c.character"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-wrap gap-3 pt-2" x-show="!error">
          <template x-if="d.processing">
            <span class="px-5 py-2.5 rounded bg-white/10 text-sm"><i class="fas fa-spinner fa-spin mr-1"></i>Converting to MP4…</span>
          </template>
          <template x-if="!d.processing && d.existing_party">
            <a :href="roomUrl(d.existing_party)" class="px-5 py-2.5 rounded bg-netflix-red hover:bg-netflix-red/90 font-semibold"><i class="fas fa-play mr-1"></i>Proceed to watch party</a>
          </template>
          <template x-if="!d.processing && d.existing_party">
            <a :href="watchUrl(d.id) + '?new=1'" class="px-5 py-2.5 rounded bg-white/10 hover:bg-white/20 font-semibold">Start a new party</a>
          </template>
          <template x-if="!d.processing && !d.existing_party && d.playable">
            <a :href="watchUrl(d.id)" class="px-5 py-2.5 rounded bg-netflix-red hover:bg-netflix-red/90 font-semibold"><i class="fas fa-play mr-1"></i>Watch now</a>
          </template>
          <!-- TMDb title not in the library → request flow -->
          <template x-if="d.tmdb && !d.in_library && d.request_status === 'pending'">
            <span class="px-5 py-2.5 rounded text-green-400 font-semibold flex items-center gap-1"><i class="fas fa-circle-check"></i>Requested</span>
          </template>
          <template x-if="d.tmdb && !d.in_library && d.request_status === 'approved'">
            <span class="px-5 py-2.5 rounded bg-white/10 text-white/60 flex items-center gap-1"><i class="fas fa-circle-notch fa-spin"></i>Adding…</span>
          </template>
          <template x-if="d.tmdb && !d.in_library && d.request_status !== 'pending' && d.request_status !== 'approved' && d.request_status !== 'fulfilled'">
            <button @click="requestThis()" class="px-5 py-2.5 rounded bg-netflix-red hover:bg-netflix-red/90 font-semibold"><i class="fas fa-plus mr-1"></i>Request this movie</button>
          </template>
          <!-- Library movie with no playable source yet -->
          <template x-if="!d.processing && !d.playable && !d.tmdb && !d.existing_party">
            <span class="px-5 py-2.5 rounded bg-white/10 text-sm text-white/50">No playable source yet</span>
          </template>
          <template x-if="d.trailer">
            <button @click="trailerOpen = !trailerOpen" class="px-5 py-2.5 rounded bg-white/10 hover:bg-white/20 font-semibold">
              <i class="fab fa-youtube mr-1 text-red-500"></i><span x-text="trailerOpen ? 'Hide trailer' : 'Watch trailer'"></span>
            </button>
          </template>
        </div>

        <!-- Embedded YouTube trailer (mounts on demand so it doesn't autoload/keep playing) -->
        <template x-if="d.trailer && trailerOpen">
          <div class="aspect-video w-full rounded-lg overflow-hidden mt-2 bg-black">
            <iframe :src="d.trailer + '?autoplay=1&rel=0'" class="w-full h-full" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>

<script>
  window.LISA_MODAL = {
    detailUrlTmpl: "{% url 'catalog:detail' 0 %}",
    tmdbUrlTmpl: "{% url 'catalog:tmdb_detail' 0 %}",
    watchUrlTmpl: "{% url 'catalog:watch' 0 %}",
    roomUrlTmpl: "{% url 'parties:room' 'CODE' %}",
    requestUrl: "{% url 'catalog:request' %}",
  };
</script>
<script src="{% static 'js/movie_modal.js' %}" defer></script>
