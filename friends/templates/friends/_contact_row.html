{# One friend row. Expects `c` (a Contact). #}
<div class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-lg px-4 py-3">
  <span class="relative w-10 h-10 rounded-full bg-netflix-red/80 flex items-center justify-center font-bold shrink-0">
    {{ c.friend.get_full_name|default:c.friend.email|first|upper }}
    <span data-presence-user="{{ c.friend.id }}" title="Offline"
          class="presence-dot absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-netflix-dark bg-white/30"></span>
  </span>
  <div class="min-w-0 flex-1">
    <div class="font-semibold truncate">{{ c.nickname|default:c.friend.get_full_name|default:c.friend.email }}</div>
    <div class="text-sm text-white/50 truncate">{{ c.friend.email }}</div>
  </div>
  <form method="POST" action="{% url 'friends:toggle_favorite' c.id %}">{% csrf_token %}
    <button title="{% if c.is_favorite %}Unfavorite{% else %}Favorite{% endif %}"
            class="w-9 h-9 rounded-full hover:bg-white/10 {% if c.is_favorite %}text-netflix-red{% else %}text-white/40{% endif %}">
      <i class="fas fa-star"></i>
    </button>
  </form>
  <form method="POST" action="{% url 'friends:remove' c.id %}" onsubmit="return confirm('Remove this friend?')">{% csrf_token %}
    <button title="Remove" class="w-9 h-9 rounded-full hover:bg-white/10 text-white/40 hover:text-white"><i class="fas fa-user-minus"></i></button>
  </form>
</div>
